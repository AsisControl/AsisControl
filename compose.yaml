# Uso local. El despliegue publico requiere proxy HTTPS y configuracion adicional.
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: ${DB_URL:?Configura DB_URL en .env}
      DB_USERNAME: ${DB_USERNAME:?Configura DB_USERNAME en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      BOOTSTRAP_ENABLED: "false"
      AUTH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_FRONTEND_URL: http://localhost:3000
      APP_MAIL_ENABLED: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      FILE_STORAGE_PATH: /app/storage
    volumes:
      - archivos:/app/storage
      - registros:/app/logs
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  archivos:
  registros:
