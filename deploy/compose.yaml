name: asiscontrol
services:
  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_URL: ${APP_URL:?Configura APP_URL}
      APP_HOST: ${APP_HOST:?Configura APP_HOST con la IP publica sin https ni puerto}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificados:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    image: ${IMAGE_PREFIX:?Configura IMAGE_PREFIX}-frontend:${IMAGE_TAG:?Configura IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    logging: *logs
  backend:
    image: ${IMAGE_PREFIX:?Configura IMAGE_PREFIX}-backend:${IMAGE_TAG:?Configura IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_URL: ${DB_URL:?Configura DB_URL}
      DB_USERNAME: ${DB_USERNAME:?Configura DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      DB_POOL_MAX_SIZE: "5"
      DB_POOL_MIN_IDLE: "1"
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAME_SITE: Strict
      CORS_ALLOWED_ORIGINS: ${APP_URL}
      APP_FRONTEND_URL: ${APP_URL}
      PAYMENTS_SIMULATOR_ENABLED: ${PAYMENTS_SIMULATOR_ENABLED:-true}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-Colegio PUCP}
      PAYMENTS_DEMO_ENABLED: "false"
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
      DEMO_SQL_MANIFEST: ${DEMO_SQL_MANIFEST:-/app/demo-sql/manifest.properties}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-false}
      BOOTSTRAP_ADMIN_DOCUMENT: ${BOOTSTRAP_ADMIN_DOCUMENT:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      APP_MAIL_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      FILE_STORAGE_PATH: /app/storage
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-local}
      FILE_STORAGE_S3_BUCKET: ${FILE_STORAGE_S3_BUCKET:-}
      FILE_STORAGE_S3_REGION: ${FILE_STORAGE_S3_REGION:-us-east-1}
      FILE_STORAGE_S3_PREFIX: ${FILE_STORAGE_S3_PREFIX:-asiscontrol/adjuntos}
    volumes:
      - archivos:/app/storage
      - ../demo/sql:/app/demo-sql:ro
      - registros:/app/logs
    logging: *logs
volumes:
  certificados:
  caddy_config:
  archivos:
  registros:
