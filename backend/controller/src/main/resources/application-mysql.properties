spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

# Flyway es el unico mecanismo autorizado para modificar el esquema MySQL.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=Esquema inicial existente
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# V1_5 completa el esquema solo en instalaciones nuevas. Las bases que ya tenian
# historial de Flyway (linea base 1) contienen ese esquema y la ven como migracion
# anterior a la ultima aplicada; se omite en lugar de ejecutarla fuera de orden.
spring.flyway.ignore-migration-patterns=*:ignored

# Hibernate verifica que las entidades y la base coincidan, pero no modifica tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.security.jwt.allow-ephemeral-secret=false
