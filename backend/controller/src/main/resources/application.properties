spring.application.name=asiscontrol-backend
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
app.security.refresh-cookie.secure=${AUTH_COOKIE_SECURE:true}
app.security.refresh-cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.storage.path=${FILE_STORAGE_PATH:./storage}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:true}
app.bootstrap.admin-document=${BOOTSTRAP_ADMIN_DOCUMENT:}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:admin}

logging.file.name=${LOG_FILE:./logs/asiscontrol.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO

# Las capacidades y cantidades enteras no se redondean desde un JSON decimal.
spring.jackson.deserialization.accept-float-as-int=false

# Correo real por SMTP. Las claves solo se suministran mediante variables del entorno.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
