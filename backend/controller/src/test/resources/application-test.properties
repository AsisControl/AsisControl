spring.datasource.url=jdbc:h2:mem:asiscontrol_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.main.allow-bean-definition-overriding=true

app.security.jwt.secret=test-secret-only-for-integration-tests-1234567890
app.security.jwt.allow-ephemeral-secret=true
app.security.refresh-cookie.secure=false
app.storage.path=${java.io.tmpdir}/asiscontrol-test-storage
